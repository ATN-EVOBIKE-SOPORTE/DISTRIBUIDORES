        * { box-sizing: border-box; }
        body {

            background: var(--evolight);
            margin: 0;
            padding: 15px;
            color: #333;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            gap: 8px;
            max-width: 900px;
            margin: 0 auto 18px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--evoborder);
            border-radius: 12px;
            background: white;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            color: #64748b;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--evodark);
            color: white;
            border-color: var(--evodark);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── SHARED CARD ── */
        .ui-container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid var(--evoborder);
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            margin: 12px 0 4px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--evoborder);
            border-radius: 10px;
            background: #fdfdfd;
            font-size: 13px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--evogreen);
        }

        /* ── NIVEL BTNS ── */
        .lvl-btns { display: flex; gap: 8px; margin-bottom: 15px; }
        .lvl-btn {
            flex: 1; padding: 12px;
            font-size: 10px; border: 1px solid var(--evoborder);
            cursor: pointer; background: white; border-radius: 10px;
            text-align: center; font-weight: bold; transition: 0.3s;
        }
        .lvl-btn.active {
            background: var(--evogreen); color: white;
            border-color: var(--evogreen);
            box-shadow: 0 4px 12px rgba(34,197,94,0.3);
        }

        /* ── ADD BOX ── */
        .add-box {
            background: #f8fafc; padding: 18px;
            border-radius: 15px; border: 1px solid #edf2f7;
            margin-bottom: 20px;
        }
        .btn-add {
            background: var(--evogreen); color: white;
            border: none; width: 100%; padding: 14px;
            border-radius: 10px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; font-size: 12px;
            transition: 0.2s;
        }
        .btn-add:hover { opacity: 0.9; }

        /* ── CART TABLE ── */
        .cart-table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 11px; }
        .cart-table tr { border-bottom: 1px solid #f1f5f9; }
        .cart-table td { padding: 8px 4px; vertical-align: middle; }
        .btn-del { color: #ef4444; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 18px; }

        /* ── PROFIT PANEL ── */
        .profit-panel {
            margin-top: 20px; padding: 20px;
            background: var(--evodark); color: white; border-radius: 15px;
        }
        .profit-val { font-size: 18px; font-weight: 900; }

        /* ── ACTIONS ── */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-f {
            padding: 14px; border: none; border-radius: 10px;
            color: white; font-weight: bold; cursor: pointer;
            font-size: 11px; text-transform: uppercase; transition: 0.2s;
        }
        .btn-f:hover { opacity: 0.85; }
        .btn-pdf-ws { background: #16a34a; grid-column: span 2; font-size: 13px; }

        /* ── REFACCIONES TAB ── */
        .refac-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
            min-height: 500px;
        }
        @media(max-width: 640px) {
            .refac-layout { grid-template-columns: 1fr; }
        }
        .model-sidebar {
            border-right: 1px solid var(--evoborder);
            padding-right: 16px;
        }
        .model-sidebar input {
            padding: 8px 10px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .model-list {
            max-height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .model-item {
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            transition: 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .model-item:hover { background: #f1f5f9; }
        .model-item.active {
            background: var(--evogreen);
            color: white;
        }

        .refac-panel { overflow: hidden; }
        .refac-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .refac-header h3 {
            margin: 0;
            font-size: 14px;
            color: var(--evodark);
        }
        .refac-search {
            flex: 1;
            min-width: 150px;
            padding: 8px 12px !important;
            font-size: 12px !important;
            margin-bottom: 0 !important;
        }
        .nivel-mini {
            display: flex;
            gap: 6px;
        }
        .nivel-mini button {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--evoborder);
            background: white;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .nivel-mini button.active {
            background: var(--evogreen);
            color: white;
            border-color: var(--evogreen);
        }

        .refac-table-wrap {
            overflow-y: auto;
            max-height: 420px;
            border: 1px solid var(--evoborder);
            border-radius: 12px;
        }
        .refac-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .refac-table thead {
            position: sticky;
            top: 0;
            background: var(--evodark);
            color: white;
            z-index: 1;
        }
        .refac-table th {
            padding: 10px 12px;
            text-align: left;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .refac-table tbody tr {
            border-bottom: 1px solid #f1f5f9;
            transition: 0.15s;
        }
        .refac-table tbody tr:hover { background: #f8fafc; }
        .refac-table td {
            padding: 9px 12px;
            vertical-align: middle;
        }
        .price-pub { color: #64748b; font-size: 11px; }

            border: none;
            border-radius: 6px;

            font-weight: bold;

            white-space: nowrap;

function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelectorAll('.tab-btn')[tab === 'cotizacion' ? 0 : 1].classList.add('active');
}

// ════════════════════════════════════════════
// TAB 1: COTIZACIÓN BICICLETAS
// ════════════════════════════════════════════
function init() {
    const select = document.getElementById('prod-select');
    select.innerHTML = db.map((p,i) => `<option value="${i}">${p.n} — ${p.v}</option>`).join('');
}

function setLvl(l) {
    nivel = l;
    document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('b-'+l).classList.add('active');
    carrito.forEach(item => {
        const orig = db.find(x => x.n === item.modelo);
        item.precio = orig[nivel];
        item.total = item.precio * item.cant;
    });
    actualizarVista();
}

function agregar() {
    const i = document.getElementById('prod-select').value;
    const p = db[i];
    const cant = parseInt(document.getElementById('p-cant').value) || 1;
    carrito.push({
        modelo: p.n, voltaje: p.v,
        color: (document.getElementById('p-color').value || 'POR DEFINIR').toUpperCase(),
        cant, precio: p[nivel], total: p[nivel] * cant
    });
    actualizarVista();
}

function quitarItem(idx) { carrito.splice(idx,1); actualizarVista(); }
function limpiarTodo() { carrito = []; actualizarVista(); }

function actualizarVista() {
    const t = document.getElementById('lista-previa');
    const pnl = document.getElementById('profit-panel');
    pnl.style.display = carrito.length ? 'block' : 'none';
    t.innerHTML = carrito.map((it,idx) => `
        <tr>
            <td><b>${it.cant}</b></td>
            <td>${it.modelo}<br><small style="color:#94a3b8">${it.color}</small></td>
            <td style="text-align:right"><b>$${it.total.toLocaleString()}</b></td>
            <td><button class="btn-del" onclick="quitarItem(${idx})">×</button></td>
        </tr>
    `).join('');
    const inv = carrito.reduce((s,i) => s + i.total, 0);
    document.getElementById('total-inv').innerText = `$${inv.toLocaleString()} MXN`;
}

function generarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','pt','letter');
    const cli = (document.getElementById('cliente').value || 'CLIENTE GENERAL').toUpperCase();
    const ase = (document.getElementById('asesor').value || 'ASESOR').toUpperCase();

    doc.addImage(LOGO_URL,'PNG',40,40,120,45);
    doc.setFontSize(18); doc.setTextColor(34,197,94); doc.setFont(undefined,'bold');
    doc.text("PROPUESTA DE NEGOCIO",570,70,{align:'right'});
    doc.setFontSize(9); doc.setTextColor(100); doc.setFont(undefined,'normal');
    doc.text(`PARA: ${cli}`,40,110);
    doc.text(`ASESOR: ${ase}`,40,122);
    doc.text(`FECHA: ${new Date().toLocaleDateString()}`,570,110,{align:'right'});

    const body = carrito.map(i => [i.cant, i.modelo, i.color, `$${i.precio.toLocaleString()}`, `$${i.total.toLocaleString()}`]);
    doc.autoTable({
        startY:140,
        head:[['CANT','MODELO','COLOR','PRECIO UNIT','SUBTOTAL']],
        body,
        theme:'grid',
        headStyles:{fillColor:[34,197,94]},
        styles:{fontSize:8},
        columnStyles:{3:{halign:'right'},4:{halign:'right'}}
    });

    let fy = doc.lastAutoTable.finalY + 30;
    const inv = carrito.reduce((s,i) => s + i.total, 0);
    doc.setFillColor(15,23,42); doc.rect(350,fy,220,60,'F');
    doc.setTextColor(255); doc.setFontSize(10);
    doc.text("INVERSIÓN TOTAL:",365,fy+25);
    doc.text(`$${inv.toLocaleString()} MXN`,555,fy+25,{align:'right'});

    doc.setFontSize(8); doc.setTextColor(80); doc.setFont(undefined,'bold');
    doc.text("MÉTODOS DE PAGO:",40,730);
    doc.setFont(undefined,'normal');
    doc.text("Transferencia SPEI, Depósito Bancario, Pago en efectivo",40,742);
    doc.setFontSize(7); doc.setTextColor(120);
    doc.text("Precios y disponibilidad sujetos a cambios sin previo aviso.",40,760);

    doc.save(`Propuesta_EvoBike_${cli.replace(/\s+/g,'_')}.pdf`);
}

function procesarEnvio() {
    const tel = document.getElementById('telefono').value;
    if(!tel || tel.length < 10) return Swal.fire("Error","WhatsApp a 10 dígitos","error");
    generarPDF();
    setTimeout(() => {
        window.open(`https://wa.me/52${tel}?text=Hola, te envío tu propuesta EvoBike.`,'_blank');
    },1000);
}

function descargarExcel() {
    const data = carrito.map(i => ({Modelo:i.modelo,Cant:i.cant,Precio:i.precio,Total:i.total}));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Cotizacion");
    XLSX.writeFile(wb,"EvoBike_Cotizacion.xlsx");
}

// ════════════════════════════════════════════
// TAB 2: REFACCIONES
// ════════════════════════════════════════════
function initRefacciones() {
    renderModelList();
}

function renderModelList() {
    const search = document.getElementById('model-search').value.toLowerCase();
    const filtered = refModelos.filter(m => m.toLowerCase().includes(search));
    document.getElementById('model-list').innerHTML = filtered.map(m => `
        <div class="model-item ${m === selectedModel ? 'active' : ''}"
             onclick="selectModel('${m.replace(/'/g,"\\'")}')">
            ${m} <small style="opacity:0.6;">(${refCatalog[m].length})</small>
        </div>
    `).join('');
}

function filterModels() {
    renderModelList();
}

function selectModel(m) {
    selectedModel = m;
    document.getElementById('refac-model-title').textContent = m;
    document.getElementById('refac-search').value = '';
    renderModelList();
    renderRefacciones();
}

function setRefNivel(n) {
    refNivel = n;
    document.getElementById('rn-p').classList.toggle('active', n === 'p');
    document.getElementById('rn-d').classList.toggle('active', n === 'd');
    renderRefacciones();
}

function renderRefacciones() {
    const tbody = document.getElementById('refac-tbody');
    if (!selectedModel) {
        tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">← Selecciona un modelo de la lista</div></td></tr>`;
        return;
    }
    const search = document.getElementById('refac-search').value.toLowerCase();
    let items = refCatalog[selectedModel] || [];
    if (search) items = items.filter(it => it.nombre.toLowerCase().includes(search) || it.id.toString().includes(search));

    if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">Sin resultados</div></td></tr>`;
        return;
    }

    tbody.innerHTML = items.map(it => {
        const precio = refNivel === 'd' ? it.precio_dist : it.precio_publico;
        const inCart = carritoRef.find(c => c.id === it.id && c.modelo === selectedModel);
        return `
        <tr>
            <td style="color:#94a3b8; font-size:10px;">${it.id}</td>
            <td><b>${it.nombre}</b></td>
            <td>
                <span class="price-${refNivel === 'd' ? 'dist' : 'pub'}">$${precio.toLocaleString()}</span>
                ${refNivel === 'd' ? '' : `<br><span class="price-pub" style="font-size:10px;">Dist: $${it.precio_dist.toLocaleString()}</span>`}
            </td>
            <td>
                ${inCart
                    ? `<span style="color:var(--evogreen); font-size:11px; font-weight:700;">✓ ${inCart.cant} pza</span>`
                    : `<button class="btn-add-ref" onclick="addRefaccion('${selectedModel.replace(/'/g,"\\'")}', '${it.id}', '${it.nombre.replace(/'/g,"\\'")}', ${it.precio_publico}, ${it.precio_dist})">+ Añadir</button>`
                }
            </td>
        </tr>`;
    }).join('');
}

function addRefaccion(modelo, id, nombre, precio_pub, precio_dist) {
    const existing = carritoRef.find(c => c.id === id && c.modelo === modelo);
    if (existing) {
        existing.cant++;
    } else {
        carritoRef.push({ modelo, id, nombre, precio_pub, precio_dist, cant: 1 });
    }
    updateRefBadge();
    renderRefacciones();
    renderCarritoRef();
}

function removeRefaccion(idx) {
    carritoRef.splice(idx,1);
    updateRefBadge();
    renderRefacciones();
    renderCarritoRef();
}

function limpiarCarritoRef() {
    carritoRef = [];
    updateRefBadge();
    renderRefacciones();
    renderCarritoRef();
}

function updateRefBadge() {
    const total = carritoRef.reduce((s,c) => s + c.cant, 0);
    document.getElementById('ref-cart-count').textContent = total;
    document.getElementById('ref-badge').textContent = total;
    document.getElementById('ref-badge').style.display = total > 0 ? 'inline' : 'none';
}

function verCarritoRef() {
    const panel = document.getElementById('ref-cart-panel');
    panel.style.display = carritoRef.length ? 'block' : 'none';
    renderCarritoRef();
    if (carritoRef.length) panel.scrollIntoView({behavior:'smooth'});
    else Swal.fire('Carrito vacío','Añade refacciones para cotizar.','info');
}

function renderCarritoRef() {
    const list = document.getElementById('ref-cart-list');
    const panel = document.getElementById('ref-cart-panel');
    if (!carritoRef.length) { panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    list.innerHTML = carritoRef.map((it, idx) => {
        const precio = refNivel === 'd' ? it.precio_dist : it.precio_pub;
        return `
        <tr>
            <td><b>${it.cant}</b></td>
            <td>${it.nombre}<br><small style="color:#94a3b8">${it.modelo}</small></td>
            <td style="text-align:right"><b>$${(precio * it.cant).toLocaleString()}</b></td>
            <td><button class="btn-del" onclick="removeRefaccion(${idx})">×</button></td>
        </tr>`;
    }).join('');
}

function generarPDFRefacciones() {
    if (!carritoRef.length) return Swal.fire('Sin items','Añade refacciones primero','info');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','pt','letter');
    const cli = (document.getElementById('cliente').value || 'CLIENTE').toUpperCase();
    const ase = (document.getElementById('asesor').value || 'ASESOR').toUpperCase();

    doc.addImage(LOGO_URL,'PNG',40,40,120,45);
    doc.setFontSize(16); doc.setTextColor(34,197,94); doc.setFont(undefined,'bold');
    doc.text("COTIZACIÓN DE REFACCIONES",570,65,{align:'right'});
    doc.setFontSize(9); doc.setTextColor(100); doc.setFont(undefined,'normal');
    doc.text(`PARA: ${cli}`,40,110);
    doc.text(`ASESOR: ${ase}`,40,122);
    doc.text(`FECHA: ${new Date().toLocaleDateString()}`,570,110,{align:'right'});
    doc.text(`NIVEL: ${refNivel === 'd' ? 'DISTRIBUIDOR' : 'PÚBLICO'}`,570,122,{align:'right'});

    const body = carritoRef.map(it => {
        const pu = refNivel === 'd' ? it.precio_dist : it.precio_pub;
        return [it.modelo, it.id, it.nombre, it.cant, `$${pu.toLocaleString()}`, `$${(pu*it.cant).toLocaleString()}`];
    });
    const total = carritoRef.reduce((s,it) => {
        const pu = refNivel === 'd' ? it.precio_dist : it.precio_pub;
        return s + pu * it.cant;
    }, 0);

    doc.autoTable({
        startY:145,
        head:[['MODELO','#PARTE','DESCRIPCIÓN','CANT','PRECIO','SUBTOTAL']],
        body,
        foot:[['','','','','TOTAL',`$${total.toLocaleString()}`]],
        theme:'grid',
        headStyles:{fillColor:[34,197,94]},
        footStyles:{fillColor:[15,23,42], textColor:255, fontStyle:'bold'},
        styles:{fontSize:8},
        columnStyles:{4:{halign:'right'},5:{halign:'right'}}
    });

    doc.setFontSize(7); doc.setTextColor(120);
    const fy = doc.lastAutoTable.finalY + 20;
    doc.text("Precios sujetos a cambios sin previo aviso. Vigencia 7 días.",40,fy);
    doc.save(`Refacciones_EvoBike_${cli.replace(/\s+/g,'_')}.pdf`);
}

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
init();
initRefacciones();
</script>
