<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvoBike Pro | Sistema de Cotización y Negocios</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

        body { font-family: 'Segoe UI', sans-serif; background: var(--evolight); margin: 0; padding: 15px; color: #333; }
        .ui-container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        label { display: block; font-size: 10px; font-weight: 800; margin: 12px 0 4px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; background: #fdfdfd; }
        .lvl-btns { display: flex; gap: 8px; margin-bottom: 15px; }
        .lvl-btn { flex: 1; padding: 12px; font-size: 10px; border: 1px solid #e2e8f0; cursor: pointer; background: white; border-radius: 10px; text-align: center; font-weight: bold; transition: 0.3s; }
        .lvl-btn.active { background: var(--evogreen); color: white; border-color: var(--evogreen); box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        .add-box { background: #f8fafc; padding: 18px; border-radius: 15px; border: 1px solid #edf2f7; margin-bottom: 20px; }
        .btn-add { background: var(--evogreen); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .cart-table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 11px; }
        .cart-table tr { border-bottom: 1px solid #f1f5f9; }
        .cart-table td { padding: 8px 4px; }
        .btn-del { color: #ef4444; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 18px; }
        .profit-panel { margin-top: 20px; padding: 20px; background: var(--evodark); color: white; border-radius: 15px; }
        .profit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .profit-val { font-size: 18px; font-weight: 900; color: var(--evogreen); }
        .roi-badge { font-size: 9px; background: rgba(34, 197, 94, 0.2); color: var(--evogreen); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-f { padding: 14px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; text-transform: uppercase; }
        .btn-pdf-ws { background: #16a34a; grid-column: span 2; font-size: 13px; }
    </style>
</head>

<div class="ui-container">
    <div style="text-align:center; margin-bottom:20px;">

    </div>
    
    <label>Información del Cliente y Asesor</label>
    <input type="text" id="asesor" placeholder="Nombre del Asesor EvoBike">
    <input type="text" id="cliente" placeholder="Nombre del Cliente / Empresa">
    <input type="number" id="telefono" placeholder="WhatsApp (10 dígitos)">
    
    <label>Nivel de Precios</label>
    <div class="lvl-btns">
        <div class="lvl-btn active" id="b-p" onclick="setLvl('p')">PÚBLICO</div>
        <div class="lvl-btn" id="b-m" onclick="setLvl('m')">MAYORISTA</div>
        <div class="lvl-btn" id="b-d" onclick="setLvl('d')">DISTRIBUIDOR</div>
    </div>

    <div class="add-box">
        <label>Producto</label>
        <select id="prod-select"></select>
        <div style="display:flex; gap:10px;">

    <table class="cart-table">

    <div id="profit-panel" class="profit-panel" style="display:none;">

    </div>

    <div class="actions">
        <button class="btn-f btn-pdf-ws" onclick="procesarEnvio()">📄 DESCARGAR PDF Y ENVIAR WA</button>

    function init() {
        const select = document.getElementById('prod-select');
        select.innerHTML = db.map((p, i) => `<option value="${i}">${p.n} - ${p.v}</option>`).join('');
    }

    function setLvl(l) {
        nivel = l;
        document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('b-'+l).classList.add('active');
        carrito.forEach(item => {
            const original = db.find(x => x.n === item.modelo);
            item.precio = original[nivel];
            item.total = item.precio * item.cant;
            item.profit = (original.p - item.precio) * item.cant;
        });
        actualizarVista();
    }

    window.addEventListener('keydown', async (e) => {
        if (e.ctrlKey && e.key.toLowerCase() === 'm') {
            e.preventDefault();
            const { value: cap } = await Swal.fire({ title:'Capital para Margen Max', input:'number', showCancelButton:true });
            if(cap) autoFill('margen', cap);
        }
        if (e.ctrlKey && e.key.toLowerCase() === 'a') {
            e.preventDefault();
            const { value: cap } = await Swal.fire({ title:'Capital para Mix Stock', input:'number', showCancelButton:true });
            if(cap) autoFill('mix', cap);
        }
    });

    function autoFill(modo, capital) {
        carrito = [];
        let restante = parseFloat(capital);
        if(modo === 'margen'){
            const sorted = [...db].sort((a,b) => b.roi - a.roi);
            sorted.forEach(p => { while(restante >= p[nivel]){ agregarSilencioso(p); restante -= p[nivel]; } });
        } else {
            const cats = ['carga', 'trabajo', 'moped', 'urban', 'deportiva'];
            let loop = true;
            while(loop){
                loop = false;
                for(let c of cats){
                    const p = db.filter(i => i.cat === c).sort((a,b) => b.roi - a.roi)[0];
                    if(p && restante >= p[nivel]){ agregarSilencioso(p); restante -= p[nivel]; loop = true; }
                }
            }
        }
        actualizarVista();
    }

    function agregarSilencioso(p) {
        const ex = carrito.find(x => x.modelo === p.n);
        if(ex){ ex.cant++; ex.total = ex.precio * ex.cant; ex.profit = (p.p - ex.precio) * ex.cant; }
        else { carrito.push({ modelo:p.n, voltaje:p.v, color:'MIX', cant:1, precio:p[nivel], total:p[nivel], profit: (p.p - p[nivel]), roi: p.roi }); }
    }

    function agregar() {
        const i = document.getElementById('prod-select').value;
        const p = db[i];
        const cant = parseInt(document.getElementById('p-cant').value);
        carrito.push({
            modelo: p.n, voltaje: p.v, color: (document.getElementById('p-color').value || 'POR DEFINIR').toUpperCase(),
            cant: cant, precio: p[nivel], total: p[nivel] * cant,
            profit: (p.p - p[nivel]) * cant, roi: p.roi
        });
        actualizarVista();
    }

    function quitarItem(idx) { carrito.splice(idx,1); actualizarVista(); }
    function limpiarTodo() { carrito = []; actualizarVista(); }

    function actualizarVista() {
        const t = document.getElementById('lista-previa');
        const pnl = document.getElementById('profit-panel');
        if(carrito.length > 0) pnl.style.display = 'block'; else pnl.style.display = 'none';

        t.innerHTML = carrito.map((it, idx) => `
            <tr>
                <td><b>${it.cant}</b></td>
                <td>${it.modelo}<br><small style="color:#94a3b8">${it.color}</small></td>
                <td style="text-align:right"><b>$${it.total.toLocaleString()}</b><br><small style="color:var(--evogreen)">+$${it.profit.toLocaleString()}</small></td>
                <td><button class="btn-del" onclick="quitarItem(${idx})">×</button></td>
            </tr>
        `).join('');

        const inv = carrito.reduce((s,i) => s + i.total, 0);
        const gain = carrito.reduce((s,i) => s + i.profit, 0);
        document.getElementById('total-inv').innerText = `$${inv.toLocaleString()}`;
        document.getElementById('total-profit').innerText = `$${gain.toLocaleString()}`;
        document.getElementById('avg-roi').innerText = inv > 0 ? `${((gain/inv)*100).toFixed(1)}% ROI` : '0%';
    }

    function generarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'pt', 'letter');
        const cli = (document.getElementById('cliente').value || "CLIENTE GENERAL").toUpperCase();
        const ase = (document.getElementById('asesor').value || "ASESOR").toUpperCase();

        doc.addImage(LOGO_URL, 'PNG', 40, 40, 120, 45);
        doc.setFontSize(18); doc.setTextColor(34, 197, 94); doc.setFont(undefined, 'bold');
        doc.text("PROPUESTA DE NEGOCIO", 570, 70, {align:'right'});
        
        doc.setFontSize(9); doc.setTextColor(100); doc.setFont(undefined, 'normal');
        doc.text(`PARA: ${cli}`, 40, 110);
        doc.text(`ASESOR: ${ase}`, 40, 122);
        doc.text(`FECHA: ${new Date().toLocaleDateString()}`, 570, 110, {align:'right'});

        const body = carrito.map(i => [i.cant, i.modelo, i.color, `$${i.precio.toLocaleString()}`, `$${i.total.toLocaleString()}`, `${i.roi}%`]);

        doc.autoTable({
            startY: 140,
            head: [['CANT', 'MODELO', 'COLOR', 'COSTO UNIT', 'SUBTOTAL', 'ROI']],
            body: body,
            theme: 'grid',
            headStyles: { fillColor: [34, 197, 94] },
            styles: { fontSize: 8 },
            columnStyles: { 3: {halign:'right'}, 4: {halign:'right'}, 5: {halign:'center'} }
        });

        let fy = doc.lastAutoTable.finalY + 30;
        const inv = carrito.reduce((s,i) => s + i.total, 0);
        const gain = carrito.reduce((s,i) => s + i.profit, 0);

        doc.setFillColor(15, 23, 42); doc.rect(350, fy, 220, 80, 'F');
        doc.setTextColor(255); doc.setFontSize(10);
        doc.text("INVERSIÓN TOTAL:", 365, fy + 25);
        doc.text(`$${inv.toLocaleString()} MXN`, 555, fy + 25, {align:'right'});
        doc.setTextColor(34, 197, 94); doc.setFont(undefined, 'bold');
        doc.text("GANANCIA ESTIMADA:", 365, fy + 50);
        doc.text(`$${gain.toLocaleString()} MXN`, 555, fy + 50, {align:'right'});
        doc.setFontSize(8); doc.setTextColor(255); doc.setFont(undefined, 'normal');
        doc.text(`RENTABILIDAD PROMEDIO: ${((gain/inv)*100).toFixed(1)}%`, 365, fy + 70);

        // PIE DE PÁGINA (LEGALES)
        doc.setFontSize(8); doc.setTextColor(80); doc.setFont(undefined, 'bold');
        doc.text("MÉTODOS DE PAGO:", 40, 730);
        doc.setFont(undefined, 'normal');
        doc.text("Transferencia SPEI, Depósito Bancario, Pago en efectivo", 40, 742);
        doc.setFontSize(7); doc.setTextColor(120);
        doc.text("Precios y disponibilidad sujetos a cambios sin previo aviso. Esta cotizacion NO garantiza la reserva de inventario", 40, 760);
        doc.text("hasta la confirmacion de pago correspondiente.", 40, 770);

        doc.save(`Propuesta_EvoBike_${cli.replace(/\s+/g, '_')}.pdf`);
    }

    function procesarEnvio() {
        const tel = document.getElementById('telefono').value;
        if(!tel || tel.length < 10) return Swal.fire("Error", "WhatsApp a 10 dígitos", "error");
        generarPDF();
        setTimeout(() => {
            window.open(`https://wa.me/52${tel}?text=Hola, te envío tu propuesta de inversión EvoBike que acabamos de generar.`, '_blank');
        }, 1000);
    }

    function descargarExcel() {
        const data = carrito.map(i => ({ Modelo: i.modelo, Cant: i.cant, Inversion: i.total, Ganancia: i.profit }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Cotizacion");
        XLSX.writeFile(wb, `EvoBike_Staff.xlsx`);
    }

    init();
</script>
</body>
</html>
